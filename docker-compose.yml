services:
  umamed:
    container_name: umamed_app
    image: localhost/umamed:latest
    build:
      context: .                  # Raíz del proyecto
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    volumes:
      # La base SQLite vive en storage/app, así que este volumen la conserva
      # junto con las fotos.
      - storage_dataUmamed:/var/www/html/storage/app
      - logsUmamed:/var/log/supervisor
    ports:
      - "6000:80"

volumes:
  storage_dataUmamed:
  logsUmamed:
